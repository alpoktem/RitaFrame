# RitaFrame Configuration
#
# Reloaded automatically when this file changes; no restart needed.

# ---- Which view to show at / (see views.py for the registry) ----
view: clock            # clock | photos
# Other views are always reachable at /view/<name> for comparison.

# ---- Server ----
host: "0.0.0.0"
port: 8000

# ---- Appearance ----
background_color: "#000000"
text_color: "#ffffff"
muted_text_color: "#8a8a8a"

# ---- Clock (strftime patterns) ----
enable_clock: true
clock_timezone: "Europe/Madrid"
clock_format: "%H:%M"
date_format: "%A, %d %B"

# ---- Weather ----
enable_weather: true
weather_provider: "open-meteo"  # open-meteo (no API key) or openweathermap
weather_location: "Barcelona,ES"
weather_api_key: ""             # only needed for openweathermap
weather_units: "metric"
weather_cache_ttl_secs: 600
forecast_days: 3                # today plus the next two days
show_precipitation: true

# ---- Bus (TMB iBus API) ----
enable_bus: true
bus_stop_name: "Bus 55 to school"
bus_stop_id: "789"              # Pg de l'Exposició - Santa Madrona
bus_line: "55"                  # Pl. Urquinaona / Parc de Montjuïc
bus_destination_filter: "Montjuïc"   # blank disables the filter
bus_expected_stop_name: "Pg de l'Exposició - Santa Madrona"  # warns if TMB renames it
bus_credentials_path: "./credentials/tmb.json"
bus_poll_interval_secs: 60
bus_departures_to_show: 3

# ---- Photos (dormant until enabled) ----
# Requires credentials/client_secret.json and a one-off browser OAuth login.
# Disabled by default; the Google client is built lazily so this cannot affect
# startup. In "background" mode the photo renders behind whichever view is active.
enable_photos: false
photos_mode: "background"      # background | carousel
photos_rotation_secs: 3600
photos_overlay_opacity: 0.45   # dim layer over a background photo, for legibility
album_name: "RitaFrame"
client_secret_path: "./credentials/client_secret.json"
frame_long_edge: "800"   # the Pi screen is 480x800 portrait: long edge is vertical
frame_short_edge: "480"
transition_time_ms: 1000
display_duration_ms: 10000

# ---- Motion detection (Raspberry Pi only) ----
# PIR on BCM pin 15 = physical header pin 10. Check with `pinout` before changing
# it: physical 10 is GPIO15, while physical 11 is GPIO17, and mixing them up
# reads a pin nothing is attached to.
#
# The module's OUT drives a 5V logic level into a 3.3V GPIO. That is outside the
# Pi's spec and is only survivable because it works; add a divider or level
# shifter if the module ever misbehaves.
run_motion_detection: true
pir_pin: 15
# Short while tuning the sensor; raise for unattended use.
sleep_on_secs: 60